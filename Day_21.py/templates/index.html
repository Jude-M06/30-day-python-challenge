{% extends "base.html" %}
{% block content %}
<h1>URL Shortener</h1>
<form action="/shorten" method="post">
  <input type="text" name="url" placeholder="https://example.com/very/long/url"
         value="{{ url or '' }}">
  <button type="submit">Shorten</button>
</form>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% if short_url %}
<div class="short">
  <p>Short URL: <a href="{{ short_url }}">{{ short_url }}</a></p>
  <p style="color:#6b7280;font-size:13px">→ {{ long_url }}</p>
</div>
{% endif %}
<p><a href="/stats">View all links →</a></p>
{% endblock %}
